
version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runner
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_URL: data/sqlite.db
    env_file:
      - .env.local
    volumes:
      - app-data:/app/frontend/data
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/backend
    env_file:
      - .env.local
    volumes:
      - app-data:/app/backend/data
    restart: unless-stopped

volumes:
  app-data: